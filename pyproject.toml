[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "RUF"]
ignore = ["RUF012"]  # mutable class attributes are idiomatic in Django/DRF

[tool.ruff.lint.per-file-ignores]
"*/tests.py" = ["S105", "S106"]  # hardcoded test passwords
